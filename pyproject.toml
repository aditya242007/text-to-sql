[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiguity-sql-analytics"
version = "0.1.0"
description = "Ambiguity-aware AI SQL analytics system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # DB
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    # Validation & config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # SQL parsing
    "sqlglot>=23.0.0",
    # Config helpers
    "pyyaml>=6.0.0",
    # Logging & retry
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    # HTTP client (API tests + UI→API)
    "httpx>=0.27.0",
    # UI
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    # LLM SDKs — imported ONLY inside app/llm/
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ui*"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "docs/",
    "db/",
    ".venv/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires Dockerized PostgreSQL (deselected by default)",
    "live_llm: requires a real LLM API key (deselected by default, opt-in)",
]
addopts = "-v -m 'not integration and not live_llm'"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
