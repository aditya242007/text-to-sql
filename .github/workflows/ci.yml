name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -m "not integration and not live_llm" --cov=app --cov-report=term-missing

  integration:
    # Becomes meaningful from Phase 1 onward (needs db/init.sql, db/roles.sql, db/seed.py)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql+psycopg://postgres:postgres@localhost:5432/analytics
      DATABASE_URL_RO: postgresql+psycopg://analytics_ro:analytics_ro@localhost:5432/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
      - name: Init DB, roles, seed
        run: |
          if [ -f db/init.sql ]; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d analytics -f db/init.sql
            PGPASSWORD=postgres psql -h localhost -U postgres -d analytics -f db/roles.sql
            python db/seed.py
          else
            echo "No DB files yet; skipping"
          fi
      - name: Integration tests
        run: pytest -m integration || [ $? -eq 5 ]   # exit 5 = no tests collected yet
